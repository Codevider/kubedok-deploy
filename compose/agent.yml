# Compose project: kubedok-agent
#
# Optional on the control-plane host, and the same file every managed host
# uses. Deliberately not on the private networks: network_mode host is
# required so wg-quick can create the WireGuard interface in the host netns
# where workload containers can reach it.
#
# Because of network_mode: host, the `kubedok-nginx` container name does not
# resolve here. KUBEDOK_API_URL must be a host-reachable URL.

name: kubedok-agent

services:
  agent:
    image: ${KUBEDOK_IMAGE_AGENT:?KUBEDOK_IMAGE_AGENT is required}
    container_name: kubedok-agent
    privileged: true
    network_mode: host
    environment:
      KUBEDOK_API_URL: ${KUBEDOK_API_URL:?KUBEDOK_API_URL is required}
      KUBEDOK_REGISTRATION_TOKEN: ${KUBEDOK_REGISTRATION_TOKEN:-}
      KUBEDOK_HOST_ADDRESS: ${KUBEDOK_HOST_ADDRESS:-}
      KUBEDOK_STATE_FILE: /var/lib/kubedok-agent/agent-state.json
      KUBEDOK_SYNC_INTERVAL_SECS: ${KUBEDOK_SYNC_INTERVAL_SECS:-15}
      RUST_LOG: ${KUBEDOK_AGENT_LOG:-kubedok_agent=info}
      # Passed when agent.env sets them. Left out, the agent's defaults apply.
      KUBEDOK_OVERLAY_ENDPOINT:
      KUBEDOK_OVERLAY_PUBLIC_IP:
      KUBEDOK_OVERLAY_LISTEN_PORT:
      KUBEDOK_OVERLAY_ENABLED:
      KUBEDOK_DNS_UPSTREAM:
      KUBEDOK_DNS_FORWARDER_FALLBACK_ANY:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_state:/var/lib/kubedok-agent
      - agent_wg:/etc/wireguard
    stop_grace_period: 30s
    restart: unless-stopped

# An agent started by the docker run command from Register host in the
# Kubedok UI has volumes of other names. When agent-update.sh takes it over,
# agent.env names them, and marks them external, since Compose did not make
# them. They have to stay: load balancers bind-mount files from the state
# volume by their path on the host, and that path holds the volume's name.
volumes:
  agent_state:
    name: ${KUBEDOK_AGENT_STATE_VOLUME:-kubedok_agent_state}
    external: ${KUBEDOK_AGENT_VOLUMES_EXTERNAL:-false}
  agent_wg:
    name: ${KUBEDOK_AGENT_WG_VOLUME:-kubedok_agent_wg}
    external: ${KUBEDOK_AGENT_VOLUMES_EXTERNAL:-false}
